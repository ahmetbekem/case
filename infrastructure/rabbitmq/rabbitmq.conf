# RabbitMQ runtime config — declarative topology yüklemesi
# definitions.json bu yola mount edilir, broker boot'ta okur.
management.load_definitions = /etc/rabbitmq/definitions.json

# Disk alarm: %5 altına düşerse publisher'ları blokla (default %50 fazla cömert)
disk_free_limit.relative = 0.05

# Heartbeat — log-service ve php-amqplib client'ları 30s zaten gönderiyor
heartbeat = 30

# Default vhost dışına çıkmıyoruz; consumer/publisher tek vhost ('/')
