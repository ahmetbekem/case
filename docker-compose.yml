name: dehasoft-test

services:
  # ─────────────────────────────────────────────────────────────
  # PostgreSQL 15 — primary datastore (4 schemas: identity, catalog, sales, currency)
  # ─────────────────────────────────────────────────────────────
  postgres:
    image: postgres:15-alpine
    container_name: dehasoft-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-testproject}
      POSTGRES_USER: ${POSTGRES_USER:-dehasoft}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dehasoft_pass}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infrastructure/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dehasoft} -d ${POSTGRES_DB:-testproject}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - dehasoft-net

  # ─────────────────────────────────────────────────────────────
  # Redis 7 — cache (currency rates, JWT blacklist) + queue backend
  # ─────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: dehasoft-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - dehasoft-net

  # ─────────────────────────────────────────────────────────────
  # RabbitMQ 3.13 — log message broker (audit/app/access exchanges)
  # Management UI: http://localhost:15672 (admin/admin)
  # ─────────────────────────────────────────────────────────────
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: dehasoft-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-admin}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-admin}
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MGMT_PORT:-15672}:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
      # Declarative topology — exchanges, queues, bindings, policies.
      # rabbitmq.conf load_definitions ile broker boot'ta yüklüyor.
      - ./infrastructure/rabbitmq/definitions.json:/etc/rabbitmq/definitions.json:ro
      - ./infrastructure/rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 5
    networks:
      - dehasoft-net

  # ─────────────────────────────────────────────────────────────
  # Elasticsearch 8.13 — log storage (audit/app/access indices)
  # ─────────────────────────────────────────────────────────────
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.0
    container_name: dehasoft-elasticsearch
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
      - bootstrap.memory_lock=true
    ulimits:
      memlock:
        soft: -1
        hard: -1
    ports:
      - "${ELASTICSEARCH_PORT:-9200}:9200"
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health | grep -E '(green|yellow)' || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
    networks:
      - dehasoft-net

  # ─────────────────────────────────────────────────────────────
  # Kibana 8.13 — log visualization (http://localhost:5601)
  # ─────────────────────────────────────────────────────────────
  kibana:
    image: docker.elastic.co/kibana/kibana:8.13.0
    container_name: dehasoft-kibana
    restart: unless-stopped
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    ports:
      - "${KIBANA_PORT:-5601}:5601"
    depends_on:
      elasticsearch:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:5601/api/status || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 10
    networks:
      - dehasoft-net

  # ─────────────────────────────────────────────────────────────
  # APPLICATION SERVICES — uncomment as bootstraps land
  # ─────────────────────────────────────────────────────────────

  # ─────────────────────────────────────────────────────────────
  # Backend (Laravel API) — nginx + php-fpm + supervisor in one image
  # ─────────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: dehasoft-backend
    restart: unless-stopped
    environment:
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${POSTGRES_DB:-testproject}
      DB_USERNAME: ${POSTGRES_USER:-dehasoft}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-dehasoft_pass}
      REDIS_CLIENT: predis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
      SESSION_DRIVER: array
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER:-admin}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-admin}
      LOG_CHANNEL: stack
      LOG_STACK: single,rabbitmq
      APP_ENV: ${APP_ENV:-local}
      APP_DEBUG: ${APP_DEBUG:-true}
      APP_KEY: ${APP_KEY:-}
      APP_NAME: Dehasoft
      JWT_SECRET: ${JWT_SECRET:-}
      BACKEND_PROXY_SECRET: ${BACKEND_PROXY_SECRET}
      SECURITY_ALLOWED_ORIGINS: ${SECURITY_ALLOWED_ORIGINS:-http://localhost:3000}
      # First-boot helper: lets a fresh `docker compose up` self-migrate.
      # Disable in production (multi-replica race).
      RUN_MIGRATIONS: ${RUN_MIGRATIONS:-1}
    ports:
      - "${BACKEND_PORT:-8000}:80"
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1/up"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    networks:
      - dehasoft-net

  # ─────────────────────────────────────────────────────────────
  # Queue worker — same image, command override skips supervisord and
  # runs the Redis-backed log-shipping queue worker directly.
  # ─────────────────────────────────────────────────────────────
  queue-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: dehasoft-queue-worker
    restart: unless-stopped
    command: ["php", "/var/www/artisan", "queue:work", "--queue=logs,default", "--tries=3", "--timeout=60", "--sleep=1"]
    # Queue worker has no HTTP listener — disable the inherited image
    # HEALTHCHECK so it doesn't perpetually report "unhealthy".
    healthcheck:
      disable: true
    environment:
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${POSTGRES_DB:-testproject}
      DB_USERNAME: ${POSTGRES_USER:-dehasoft}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-dehasoft_pass}
      REDIS_CLIENT: predis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER:-admin}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-admin}
      APP_ENV: ${APP_ENV:-local}
      APP_KEY: ${APP_KEY:-}
      JWT_SECRET: ${JWT_SECRET:-}
      LOG_CHANNEL: single
    depends_on:
      redis: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
    networks:
      - dehasoft-net

  # ─────────────────────────────────────────────────────────────
  # Frontend (Next.js 16 standalone) — BFF + UI
  # ─────────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: dehasoft-frontend
    restart: unless-stopped
    environment:
      # Internal Docker DNS — backend container exposes port 80 (nginx).
      # NEVER prefixed with NEXT_PUBLIC_ — would leak to the browser bundle.
      LARAVEL_API_URL: http://backend/api/v1
      BACKEND_PROXY_SECRET: ${BACKEND_PROXY_SECRET}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      NODE_ENV: ${NODE_ENV:-production}
      NEXT_PUBLIC_APP_NAME: Dehasoft
      NEXT_PUBLIC_DEFAULT_CURRENCY: TRY
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3000/", "-o", "/dev/null"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    networks:
      - dehasoft-net

  # ─────────────────────────────────────────────────────────────
  # Log service (Node.js/TypeScript) — RabbitMQ → Elasticsearch
  # 3 consumer: audit, app, access. Topology defansif olarak burada da
  # tanımlanır; TASK 0.18 declarative definitions.json devreye girince
  # broker tarafında zaten mevcut olduğu için noop'a düşer.
  # ─────────────────────────────────────────────────────────────
  log-service:
    build:
      context: ./log-service
      dockerfile: Dockerfile
    container_name: dehasoft-log-service
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER:-admin}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-admin}
      RABBITMQ_VHOST: /
      ELASTICSEARCH_URL: http://elasticsearch:9200
    depends_on:
      rabbitmq: { condition: service_healthy }
      elasticsearch: { condition: service_healthy }
    networks:
      - dehasoft-net

# ─────────────────────────────────────────────────────────────
volumes:
  postgres-data:
    driver: local
  redis-data:
    driver: local
  rabbitmq-data:
    driver: local
  elasticsearch-data:
    driver: local

networks:
  dehasoft-net:
    driver: bridge
    name: dehasoft-net
