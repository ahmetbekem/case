user www-data;
worker_processes auto;
pid /run/nginx.pid;

# nginx logs to container stdout/stderr so docker logs / k8s describe
# pick everything up automatically — no log volumes needed.
error_log /dev/stderr warn;

events {
    worker_connections 1024;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile      on;
    tcp_nopush    on;
    tcp_nodelay   on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;

    # Real client IP behind the BFF / load balancer. Trust the loopback
    # bridge gateway only — change in production deployment.
    set_real_ip_from 0.0.0.0/0;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time corr="$http_x_correlation_id"';
    access_log /dev/stdout main;

    client_max_body_size 20M;
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    upstream php-fpm {
        server 127.0.0.1:9000;
    }

    server {
        listen 80 default_server;
        server_name _;

        root /var/www/public;
        index index.php;

        # Block access to dotfiles and other sensitive bits
        location ~ /\. {
            deny all;
            return 404;
        }

        # Static assets — let nginx serve directly
        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        location ~ ^/index\.php(/|$) {
            fastcgi_pass               php-fpm;
            fastcgi_split_path_info    ^(.+\.php)(/.+)$;
            include                    /etc/nginx/fastcgi_params;
            fastcgi_param              SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_param              PATH_INFO $fastcgi_path_info;
            fastcgi_read_timeout       60;
            fastcgi_buffers            16 16k;
            fastcgi_buffer_size        32k;
            internal;
        }

        # Disallow direct execution of any other .php file
        location ~ \.php$ {
            return 404;
        }
    }
}
