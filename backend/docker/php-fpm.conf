; ─── App-level php-fpm pool overrides ──────────────────────────────
; Drops in alongside the stock www.conf as zz-app.conf so its values win.
; ───────────────────────────────────────────────────────────────────

[www]
user  = www-data
group = www-data

listen = 127.0.0.1:9000

pm                   = dynamic
pm.max_children      = 20
pm.start_servers     = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 8
pm.max_requests      = 500

; Stream worker logs to container stdout/stderr
catch_workers_output = yes
decorate_workers_output = no
access.log = /dev/null

clear_env = no

; Slow-request log — anything over 5 seconds gets a stack frame on stderr
request_slowlog_timeout = 5s
slowlog                 = /dev/stderr
