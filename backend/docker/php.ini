; ─── App-level PHP overrides ───────────────────────────────────────
; Loaded as zz-app.ini (last; wins over framework defaults).
; ───────────────────────────────────────────────────────────────────

memory_limit            = 256M
post_max_size           = 20M
upload_max_filesize     = 10M
max_execution_time      = 60
max_input_time          = 60
default_socket_timeout  = 60
date.timezone           = UTC

; PHP 8.5's deprecation noise is moot here (we ship 8.4 in the runtime
; image), but suppressing E_DEPRECATED keeps any stray legacy notice
; from cluttering production logs.
error_reporting         = E_ALL & ~E_DEPRECATED & ~E_USER_DEPRECATED
display_errors          = Off
display_startup_errors  = Off
log_errors              = On
error_log               = /dev/stderr

; Sessions disabled at app level (we use array driver via .env), but
; keep cookie defaults conservative in case any vendor pkg flips them on.
session.cookie_httponly = On
session.cookie_secure   = On
session.cookie_samesite = Strict

; ─── OPcache — production performance ──────────────────────────────
opcache.enable                  = 1
opcache.enable_cli              = 0
opcache.memory_consumption      = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files   = 16229
opcache.revalidate_freq         = 0
opcache.validate_timestamps     = 0
opcache.fast_shutdown           = 1
opcache.jit                     = 1255
opcache.jit_buffer_size         = 64M
