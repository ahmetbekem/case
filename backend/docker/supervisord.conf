; supervisord — runs nginx + php-fpm in a single container.
; "One process per container" purists prefer separate services; we
; bundle for simpler dev-compose orchestration. Both processes log
; straight to docker stdout/stderr.

[supervisord]
nodaemon       = true
user           = root
logfile        = /dev/null
logfile_maxbytes = 0
pidfile        = /run/supervisord.pid
loglevel       = info

[unix_http_server]
file = /run/supervisor.sock
chmod = 0700

[supervisorctl]
serverurl = unix:///run/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[program:php-fpm]
command          = php-fpm --nodaemonize --fpm-config /usr/local/etc/php-fpm.conf
autostart        = true
autorestart      = true
priority         = 5
startretries     = 3
stdout_logfile   = /dev/stdout
stdout_logfile_maxbytes = 0
stderr_logfile   = /dev/stderr
stderr_logfile_maxbytes = 0
killasgroup      = true
stopasgroup      = true

[program:nginx]
command          = nginx -g "daemon off;"
autostart        = true
autorestart      = true
priority         = 10
startretries     = 3
stdout_logfile   = /dev/stdout
stdout_logfile_maxbytes = 0
stderr_logfile   = /dev/stderr
stderr_logfile_maxbytes = 0
killasgroup      = true
stopasgroup      = true
