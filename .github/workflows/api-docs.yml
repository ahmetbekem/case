name: api-docs

on:
  push:
    branches: [main]
    paths:
      - 'backend/src/Presentation/**'
      - 'backend/src/Application/**/DTOs/**'
      - 'backend/config/l5-swagger.php'
      - 'scripts/generate-postman-collection.sh'
      - 'scripts/inject-postman-auth.mjs'
      - 'package.json'
      - '.github/workflows/api-docs.yml'

# Yalnızca tek instance — auto-commit ile push çakışmasın
concurrency:
  group: api-docs-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write   # auto-commit için

jobs:
  regenerate:
    name: Regenerate OpenAPI + Postman
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - uses: actions/checkout@v4
        with:
          # Auto-commit aynı branch'e push edecek; default 1-deep checkout
          # yetmez (push reddedilir). Tam history al.
          fetch-depth: 0
          persist-credentials: true

      # ─── PHP / Composer / OpenAPI generate ────────────────────────
      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, intl, xml
          coverage: none
          tools: composer:v2
          ini-values: error_reporting=E_ALL & ~E_DEPRECATED & ~E_USER_DEPRECATED

      - name: Composer cache
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: composer-${{ runner.os }}-${{ hashFiles('backend/composer.lock', 'backend/composer.json') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Install backend dependencies
        working-directory: backend
        # --no-scripts — package post-install (vendor:publish) production
        # CI runner'da .env yokluğunda patlar. Spec generation için runtime
        # service'lere ihtiyaç yok.
        run: composer install --no-interaction --no-progress --prefer-dist --no-scripts

      - name: Bootstrap minimal .env
        working-directory: backend
        # l5-swagger:generate APP_KEY çağırmasa da Laravel boot yapar — env eksikliğinden patlamasın
        run: |
          cp .env.example .env
          php artisan key:generate --ansi --force

      - name: Regenerate OpenAPI spec
        working-directory: backend
        run: php artisan l5-swagger:generate

      # ─── Node / Postman generate ──────────────────────────────────
      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install root tooling
        run: npm ci --no-audit --no-fund

      - name: Regenerate Postman collection
        run: bash scripts/generate-postman-collection.sh

      # ─── Auto-commit (no-op if no changes) ────────────────────────
      - name: Commit regenerated artifacts
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add backend/storage/api-docs/api-docs.json docs/postman/eticaret-demo.postman_collection.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "docs(api): auto-regenerate openapi spec + postman collection [skip ci]"
            git push
          fi
