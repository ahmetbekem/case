name: log-service

on:
  push:
    branches: [main]
    paths:
      - 'log-service/**'
      - '.github/workflows/log-service.yml'
  pull_request:
    paths:
      - 'log-service/**'
      - '.github/workflows/log-service.yml'

jobs:
  build:
    name: Typecheck + Lint + Build (Node 20)
    runs-on: ubuntu-latest
    timeout-minutes: 8

    defaults:
      run:
        working-directory: log-service

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: log-service/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Verify build output
        # dist/index.js eksikse build sessizce başarısız olmuş demektir
        run: test -f dist/index.js
